[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0.3", "wheel"]

[project]
authors = [{ name = "Akhil Harihar", email = "hariharakhil@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Development Status :: 4 - Beta",
]
dependencies = ["Flask"]
description = "Flask Extension to enable or disable Maintenance mode."
license = "MIT"
license-files = ["LICEN[CS]E*"]
name = "Flask-Maintenance"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.0"
urls = { Homepage = "https://github.com/akhilharihar/Flask-Maintenance" }
version = "0.1.0"

[project.entry-points."flask.commands"]
maintenance = "flask_maintenance.cli:maintenance"
